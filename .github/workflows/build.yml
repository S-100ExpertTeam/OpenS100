name: build

# Windows build + unit tests, and the vcpkg port on Linux and macOS.
# Manual only for now (owner decision 2026-11-08): the first run builds hdf5/libxslt/openssl
# from source and takes a long time. Enable push/pull_request triggers once the binary cache is warm.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Which jobs to run
        type: choice
        default: all
        options: [all, windows, port]

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
  VCPKG_ROOT: "C:/vcpkg"

jobs:
  windows:
    if: inputs.jobs != 'port'
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Pin vcpkg to the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT/vcpkg" integrate install

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild OpenS100.sln -m -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 -v:minimal

      - name: Run unit tests
        shell: pwsh
        run: |
          & "${{ matrix.configuration }}_x64/OpenS100Tests.exe" --gtest_output=xml:test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: test-results.xml

  # The vcpkg port (ports/opens100) with every feature, on the platforms the Visual Studio
  # solution does not cover, then the external consumer example against the installed package.
  port:
    if: inputs.jobs != 'windows'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      FEATURES: "opens100[core,feature-catalogue,geometry,portrayal-catalogue,coverage,system-database]"
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-port-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'ports/opens100/vcpkg.json') }}
          restore-keys: vcpkg-port-${{ matrix.os }}-

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      # vcpkg lives outside the checkout and runs from its own directory: next to the repository's
      # vcpkg.json it would switch to manifest mode and refuse package arguments.
      - name: Get vcpkg at the manifest baseline
        run: |
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          baseline=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          mkdir -p "$VCPKG_ROOT" "${{ github.workspace }}/vcpkg-cache"
          git -C "$VCPKG_ROOT" init -q
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install dependencies (cached)
        working-directory: ${{ runner.temp }}/vcpkg
        run: |
          ./vcpkg install geographiclib pugixml utfcpp hdf5 openssl sqlite3 zlib

      # The port builds this checkout and vcpkg does not hash its sources, so never take
      # opens100 itself from the binary cache.
      - name: Build the port
        env:
          VCPKG_BINARY_SOURCES: "clear"
        working-directory: ${{ runner.temp }}/vcpkg
        run: |
          ./vcpkg install "$FEATURES" --overlay-ports="$GITHUB_WORKSPACE/ports"

      - name: Build and run the consumer example
        run: |
          cmake -S examples/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build/consumer
          build/consumer/opens100_consumer ProgramData/FC/S-101_FC.xml ProgramData/PC/S101_Portrayal/portrayal_catalogue.xml

      - name: Upload vcpkg build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: port-logs-${{ matrix.os }}
          path: ${{ env.VCPKG_ROOT }}/buildtrees/opens100/*.log
